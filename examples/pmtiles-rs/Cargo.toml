[package]
name = "pmtiles-rs-tile"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Fetch one tile over HTTP with the pmtiles crate; used by pmtiles-lab's CLI reader harness."

[dependencies]
pmtiles = { version = "=0.24.0", default-features = false, features = ["http-async"] }
tokio = { version = "1", features = ["rt", "macros"] }
