name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled. Each push to main gets its own
# group (the run id), so no later push can cancel it, running or pending:
# within one group GitHub cancels a pending run when a newer one queues, even
# with cancel-in-progress false. Each main run may be waiting to publish its
# release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Release version rule (docs/release-proposal.md): v0.4.<run number of this
  # workflow>. Run numbers only grow, so versions are monotonic; gaps (pull
  # request runs, failed runs) are expected. A rerun keeps its run number and
  # therefore its version. Pull request builds are labelled dev-<sha>.
  VERSION: ${{ github.event_name == 'push' && format('v0.4.{0}', github.run_number) || format('dev-{0}', github.sha) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go version
      - run: ./scripts/check.sh
      - name: Build the five release binaries, fixture bundle and SHA256SUMS
        run: ./scripts/build-release.sh "$VERSION" dist
      - name: Check every binary is a CGO-free executable for its target
        run: |
          file dist/pmtiles-lab_*
          for f in dist/pmtiles-lab_*; do
            case $f in *.tar.gz) continue ;; esac
            go version -m "$f" | grep -q 'CGO_ENABLED=0' || { echo "$f: not CGO_ENABLED=0"; exit 1; }
          done
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Native smoke test (linux/amd64 release binary)
        run: ./scripts/smoke.sh "dist/pmtiles-lab_${VERSION}_linux_amd64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # A Windows checkout with core.autocrlf=true (the Git for Windows default)
  # running the documented local path in Git Bash. The race step is skipped
  # here only; the Linux job above runs it.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Set core.autocrlf=true before checkout
        run: |
          git config --global core.autocrlf true
          test "$(git config --get core.autocrlf)" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert the autocrlf checkout left text files with LF
        run: |
          test "$(git config --get core.autocrlf)" = true
          if git ls-files -z --eol | tr '\0' '\n' | grep -E '^i/lf +w/crlf'; then
            echo "working-tree files converted to CRLF"; exit 1
          fi
          git ls-files --eol cmd/pmtiles-lab/main.go scripts/check.sh fixtures/SHA256SUMS
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go version
      - run: SKIP_RACE=1 ./scripts/check.sh
      - name: Native smoke test (windows/amd64, built here with CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid= -X main.version=$VERSION" -o pmtiles-lab.exe ./cmd/pmtiles-lab
          ./scripts/smoke.sh pmtiles-lab.exe

  # Cross-compiling proves the darwin binaries build; this proves the CLI
  # launches and works on a Mac (macos-latest is Apple silicon).
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go version && uname -m
      - name: Native smoke test (darwin/arm64, built here with CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid= -X main.version=$VERSION" -o pmtiles-lab ./cmd/pmtiles-lab
          ./scripts/smoke.sh pmtiles-lab
      - name: darwin/amd64 under Rosetta 2, if the runner has it
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 is not available on this runner: darwin/amd64 was cross-compiled but not launched"
            exit 0
          fi
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid= -X main.version=$VERSION" -o pmtiles-lab-amd64 ./cmd/pmtiles-lab
          file pmtiles-lab-amd64
          ./scripts/smoke.sh pmtiles-lab-amd64

  # Publishes the binaries the check job built and smoke-tested, only for a
  # push to main, only after the Linux, Windows and macOS gates passed for
  # this exact commit. The only job with write permission.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Verify the artifact
        run: |
          case $VERSION in v0.4.[0-9]*) ;; *) echo "bad version $VERSION"; exit 1 ;; esac
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(ls dist | wc -l)" -eq 7
          ls -l dist
      - name: Create the release (idempotent; never moves a tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$VERSION
          # An existing tag must already point at this commit.
          if sha=$(gh api "repos/$GH_REPO/commits/tags/$tag" --jq .sha 2>/dev/null); then
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "tag $tag exists at $sha, not $GITHUB_SHA; refusing to move it"; exit 1
            fi
            echo "tag $tag already exists at this commit"
          fi
          notes="Automatic release of $GITHUB_SHA after the Linux, Windows and macOS CI gates passed (run $GITHUB_RUN_ID). CLI version $tag; the fixture generator version is reported by 'pmtiles-lab version'. Verify downloads with: sha256sum --check SHA256SUMS"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A rerun. Published assets are never deleted or replaced: each
            # existing asset must have the SHA-256 of this run's file, and
            # only missing assets are uploaded. A complete, published
            # release is left untouched.
            existing=$(mktemp -d)
            names=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if [ -n "$names" ]; then
              gh release download "$tag" --dir "$existing"
            fi
            missing=()
            for f in dist/*; do
              name=$(basename "$f")
              if [ -e "$existing/$name" ]; then
                want=$(sha256sum < "$f" | cut -d' ' -f1)
                have=$(sha256sum < "$existing/$name" | cut -d' ' -f1)
                if [ "$want" != "$have" ]; then
                  echo "$tag: asset $name has sha256 $have, this run built $want; refusing to replace it"; exit 1
                fi
              else
                missing+=("$f")
              fi
            done
            for name in $names; do
              [ -e "dist/$name" ] || { echo "$tag: unexpected asset $name; refusing to continue"; exit 1; }
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "$tag: uploading missing assets: ${missing[*]}"
              gh release upload "$tag" "${missing[@]}"
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$tag" --draft=false
            fi
            echo "release $tag already existed; ${#missing[@]} missing asset(s) uploaded, existing assets verified"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes "$notes" --latest=false
          fi
          # Mark as latest only if no higher v0.4.x release exists (runs can
          # finish out of order, and main runs can overlap).
          highest=$(gh release list --limit 200 --exclude-drafts --json tagName --jq '.[].tagName' | grep -E '^v0\.4\.[0-9]+$' | sort -t. -k3,3n | tail -1)
          if [ "$highest" = "$tag" ]; then
            gh release edit "$tag" --latest
          fi
          gh release view "$tag"
